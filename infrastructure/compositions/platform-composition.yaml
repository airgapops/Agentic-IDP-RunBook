apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: compositeplatforms.zerops.internal
  labels:
    provider: helm
spec:
  compositeTypeRef:
    apiVersion: zerops.internal/v1alpha1
    kind: CompositePlatform
  compositeDeletePolicy: Background
  writeConnectionSecretsToNamespace: crossplane-system
  resources:
  - name: remote-namespace
    base:
      apiVersion: kubernetes.crossplane.io/v1alpha1
      kind: Object
      spec:
        providerConfigRef:
          name: ryzen-compute-cluster
        forProvider:
          manifest:
            apiVersion: v1
            kind: Namespace
            metadata:
              name: default-ns
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.namespace
      toFieldPath: spec.forProvider.manifest.metadata.name
  - name: vcluster-helm
    base:
      apiVersion: helm.crossplane.io/v1beta1
      kind: Release
      spec:
        providerConfigRef:
          name: ryzen-helm-cluster
        forProvider:
          chart:
            name: vcluster
            repository: https://charts.loft.sh
            version: 0.19.5
          namespace: default-ns
          values:
            vcluster:
              extraArgs:
              - --tls-san=192.168.0.13
            # cidr-wrapper: init container that wraps the k3s binary to deduplicate
            # --service-cidr args. The syncer auto-detects (fails on K3s 1.35+) and
            # appends fallback 10.96.0.0/12. The wrapper strips all --service-cidr
            # args and injects exactly ONE correct value (10.43.0.0/16 = host CIDR).
            syncer:
              extraInitContainers:
              - name: cidr-wrapper
                image: busybox:1.36
                command:
                - /bin/sh
 