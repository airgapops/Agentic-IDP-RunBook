# =============================================================================
# Template: Secret — Per-Component Secrets
# =============================================================================
# Usage:
#   1. Replace {component} with actual component name
#   2. Fill in the actual secret values
#   3. kubectl apply -f secret.yaml
#
# IMPORTANT: Use stringData (plain text), NOT data (base64)
# IMPORTANT: NEVER commit real secrets to Git
apiVersion: v1
kind: Secret
metadata:
  name: "{component}-secrets"
  namespace: default
  labels:
    openchoreo.dev/component: "{component}"
type: Opaque
stringData:
  # Common patterns:
  DATABASE_URL: "postgresql://user:password@host:5432/dbname"
  API_KEY: "your-api-key-here"
  JWT_SECRET: "your-jwt-secret"
  # Add more key-value pairs as needed
