---
# Traefik — IngressController para el host K3s del Ryzen
# Obtiene IP 192.168.0.200 via MetalLB
# K3s tiene Traefik deshabilitado via config.yaml (gestionado aquí via Crossplane)
apiVersion: helm.crossplane.io/v1beta1
kind: Release
metadata:
  name: traefik
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  providerConfigRef:
    name: ryzen-helm-cluster
  forProvider:
    chart:
      name: traefik
      repository: https://helm.traefik.io/traefik
      version: "26.1.0"
    namespace: traefik-system
    values:
      # LoadBalancer via MetalLB → asignará 192.168.0.200
      service:
        type: LoadBalancer

      # Puertos HTTP y HTTPS
      ports:
        web:
          port: 8000
          expose: true
          exposedPort: 80
          # Redirigir HTTP → HTTPS
          redirectTo:
            port: websecure
        websecure:
          port: 8443
          expose: true
          exposedPort: 443
          tls:
            enabled: true

      # IngressClass por defecto
      ingressClass:
        enabled: true
        isDefaultClass: true

      # Permitir Ingress y TLS secrets de todos los namespaces
      # (vclusters sincronizan Ingress al namespace del host)
      providers:
        kubernetesIngress:
          enabled: true
          allowExternalNameServices: false
          publishedService:
            enabled: true

      rbac:
        enabled: true

      # Dashboard deshabilitado (no expuesto públicamente)
      ingressRoute:
        dashboard:
          enabled: false
