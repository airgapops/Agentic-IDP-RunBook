apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: compositeplatforms.zerops.internal
  labels:
    provider: helm
spec:
  compositeTypeRef:
    apiVersion: zerops.internal/v1alpha1
    kind: CompositePlatform

  writeConnectionSecretsToNamespace: crossplane-system
  resources:
  - name: remote-namespace
    base:
      apiVersion: kubernetes.crossplane.io/v1alpha1
      kind: Object
      spec:
        providerConfigRef:
          name: ryzen-compute-cluster
        forProvider:
          manifest:
            apiVersion: v1
            kind: Namespace
            metadata:
              name: default-ns
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.namespace
      toFieldPath: spec.forProvider.manifest.metadata.name
  - name: vcluster-helm
    base:
      apiVersion: helm.crossplane.io/v1beta1
      kind: Release
      spec:
        providerConfigRef:
          name: ryzen-helm-cluster
        forProvider:
          chart:
            name: vcluster
            repository: https://charts.loft.sh
            # Downgraded from 0.19.5 — in 0.19.x the syncer binary removed
            # --service-cidr from its CLI, breaking ALL helm CIDR config methods.
            # In 0.15.x the syncer accepts --service-cidr correctly.
            version: 0.15.5
          namespace: default-ns
          values:
            # serviceCIDR works correctly in vcluster 0.15.x (unlike 0.19.5).
            # Sets --service-cidr on both the syncer AND k3s, which is correct
            # for 0.15.x where syncer accepts this flag.
            serviceCIDR: "10.43.0.0/16"
            vcluster:
              extraArgs:
              - --tls-san=192.168.0.13
            syncer:
              extraArgs:
              - --tls-san=192.168.0.13
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.namespace
      toFieldPath: spec.forProvider.namespace
    - type: FromCompositeFieldPath
      fromFieldPath: metadata.name
      toFieldPath: metadata.name
      transforms:
      - type: string
        string:
          fmt: "%s-vcluster"
