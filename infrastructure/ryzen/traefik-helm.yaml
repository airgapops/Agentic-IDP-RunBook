---
# Traefik — IngressController para el host K3s del Ryzen
# FIXES APLICADOS (2026-05-26):
# 1. Sin redirect global HTTP→HTTPS (rompe ACME HTTP-01 challenge)
# 2. hostNetwork: true — Traefik corre en el network namespace del HOST
#    para alcanzar pod IPs directamente (kube-router deja chains iptables
#    obsoletas que bloquean pod-to-pod entre Traefik y los solver pods)
# 3. dnsPolicy: ClusterFirstWithHostNet — DNS cluster sigue funcionando
apiVersion: helm.crossplane.io/v1beta1
kind: Release
metadata:
  name: traefik
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  providerConfigRef:
    name: ryzen-helm-cluster
  forProvider:
    chart:
      name: traefik
      repository: https://helm.traefik.io/traefik
      version: "26.1.0"
    namespace: traefik-system
    values:
      service:
        type: LoadBalancer

      ports:
        web:
          port: 8000
          expose: true
          exposedPort: 80
          # Sin redirectTo: cert-manager ACME HTTP-01 necesita HTTP puro
        websecure:
          port: 8443
          expose: true
          exposedPort: 443
          tls:
            enabled: true

      ingressClass:
        enabled: true
        isDefaultClass: true

      deployment:
        # hostNetwork permite a Traefik alcanzar pod IPs directamente
        # (fix para kube-router iptables chains obsoletas post-reboot)
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet

      providers:
        kubernetesIngress:
          enabled: true
          publishedService:
            enabled: true

      rbac:
        enabled: true

      ingressRoute:
        dashboard:
          enabled: false
