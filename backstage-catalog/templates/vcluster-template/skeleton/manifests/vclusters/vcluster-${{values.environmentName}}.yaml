apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vcluster-${{ values.environmentName }}
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.loft.sh
    chart: vcluster
    targetRevision: 0.15.5
    helm:
      values: |
        serviceCIDR: "10.43.0.0/16"
        vcluster:
          extraArgs:
          - --tls-san=192.168.0.13
        syncer:
          extraArgs:
          - --tls-san=192.168.0.13
        service:
          type: NodePort
        sync:
          ingresses:
            enabled: true
  destination:
    name: ryzen
    namespace: vcluster-${{ values.environmentName }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
