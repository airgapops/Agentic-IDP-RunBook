apiVersion: v1
kind: Service
metadata:
  name: backstage-proxy
  namespace: default
spec:
  type: ExternalName
  externalName: backstage.openchoreo-control-plane.svc.cluster.local
  ports:
  - port: 7007
---
apiVersion: v1
kind: Service
metadata:
  name: openchoreo-api-proxy
  namespace: default
spec:
  type: ExternalName
  externalName: openchoreo-api.openchoreo-control-plane.svc.cluster.local
  ports:
  - port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: thunder-proxy
  namespace: default
spec:
  type: ExternalName
  externalName: thunder.thunder.svc.cluster.local
  ports:
  - port: 8090
