apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: compositeplatforms.zerops.internal
  labels:
    provider: helm
spec:
  compositeTypeRef:
    apiVersion: zerops.internal/v1alpha1
    kind: CompositePlatform

  writeConnectionSecretsToNamespace: crossplane-system
  resources:
  - name: remote-namespace
    base:
      apiVersion: kubernetes.crossplane.io/v1alpha1
      kind: Object
      spec:
        providerConfigRef:
          name: ryzen-compute-cluster
        forProvider:
          manifest:
            apiVersion: v1
            kind: Namespace
            metadata:
              name: default-ns
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.namespace
      toFieldPath: spec.forProvider.manifest.metadata.name
  - name: vcluster-helm
    base:
      apiVersion: helm.crossplane.io/v1beta1
      kind: Release
      spec:
        providerConfigRef:
          name: ryzen-helm-cluster
        forProvider:
          chart:
            name: vcluster
            repository: https://charts.loft.sh
            version: 0.19.5
          namespace: default-ns
          values:
            vcluster:
              extraArgs:
              - --tls-san=192.168.0.13
              - --service-cidr=10.43.0.0/16
            # cidr-wrapper: safety net that strips any duplicate --service-cidr args
            # the syncer auto-appends when CIDR detection fails, and enforces
            # exactly ONE --service-cidr=10.43.0.0/16 for k3s.
            # NOTE: serviceCIDR top-level and syncer.extraArgs BOTH incorrectly
            # add --service-cidr to the syncer binary (which rejects that flag).
            # Only vcluster.extraArgs is the correct path for k3s CIDR config.
            syncer:
              extraInitContainers:
              - name: cidr-wrapper
                image: busybox:1.36
                command:
                - /bin/sh
                - -c
                - |
                  mv /binaries/k3s /binaries/k3s-real
                  cat > /binaries/k3s << 'WEOF'
                  #!/bin/sh
                  newargs=""
                  skip=false
                  for arg in "$@"; do
                    if [ "$skip" = "true" ]; then
                      skip=false
                      continue
                    fi
                    case "$arg" in
                      --service-cidr=*) ;;
                      --service-cidr) skip=true ;;
                      *) newargs="$newargs $arg" ;;
                    esac
                  done
                  eval exec /binaries/k3s-real $newargs --service-cidr=10.43.0.0/16
                  WEOF
                  chmod +x /binaries/k3s
                  echo "CIDR wrapper installed"
                volumeMounts:
                - mountPath: /binaries
                  name: binaries
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.namespace
      toFieldPath: spec.forProvider.namespace
    - type: FromCompositeFieldPath
      fromFieldPath: metadata.name
      toFieldPath: metadata.name
      transforms:
      - type: string
        string:
          fmt: "%s-vcluster"
