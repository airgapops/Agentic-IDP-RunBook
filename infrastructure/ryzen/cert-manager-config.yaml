---
# Secret con el CA Root de Step-CA para que cert-manager lo confíe
# Base64 del cert: https://192.168.0.9:9000/roots.pem
# Issuer: Zerops Internal Root CA
apiVersion: kubernetes.crossplane.io/v1alpha1
kind: Object
metadata:
  name: step-ca-root-secret
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  providerConfigRef:
    name: ryzen-compute-cluster
  forProvider:
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        name: step-ca-root
        namespace: cert-manager
      type: Opaque
      data:
        # Zerops Internal Root CA (válido hasta 2036-05-16)
        # Generado desde https://192.168.0.9:9000/roots.pem
        ca.crt: 
---
# ClusterIssuer para Step-CA via ACME HTTP-01
# Emite certs para cualquier subdominio *.zerops.internal
# HTTP-01: Step-CA valida el challenge via HTTP en el dominio
apiVersion: kubernetes.crossplane.io/v1alpha1
kind: Object
metadata:
  name: step-ca-clusterissuer
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  providerConfigRef:
    name: ryzen-compute-cluster
  forProvider:
    manifest:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: step-ca
      spec:
        acme:
          # Step-CA ACME endpoint
          server: https://192.168.0.9:9000/acme/acme/directory
          email: admin@zerops.internal
          # CA bundle para confiar en el Step-CA TLS (autofirmado)
          caBundle: 
          # Cuenta ACME (key se genera automáticamente)
          privateKeySecretRef:
            name: step-ca-acme-account-key
          solvers:
          # HTTP-01 via Traefik IngressClass
          - http01:
              ingress:
                ingressClassName: traefik
