# =============================================================================
# OpenChoreo Component — RabbitMQ Message Broker
# =============================================================================
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: rabbitmq
  namespace: default
  annotations:
    openchoreo.dev/display-name: "RabbitMQ Message Broker"
    openchoreo.dev/description: >-
      RabbitMQ 3.13 message broker with management web UI.
      Provides async messaging (AMQP) for microservice communication.
  labels:
    openchoreo.dev/name: rabbitmq
spec:
  owner:
    projectName: default
  componentType:
    kind: ClusterComponentType
    name: deployment/service
---
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: rabbitmq
  namespace: default
spec:
  owner:
    projectName: default
    componentName: rabbitmq
  container:
    image: rabbitmq:3.13-management-alpine
