apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ryzen-cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.14.5
    helm:
      values: |
        installCRDs: true
        replicaCount: 1
        webhook:
          enabled: true
        cainjector:
          enabled: true
  destination:
    name: ryzen
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
