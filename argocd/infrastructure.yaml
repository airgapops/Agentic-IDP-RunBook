apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitea.zerops.internal/jadamson/airgap-ops.git
    targetRevision: HEAD
    path: infrastructure/ryzen
    directory:
      recurse: true
  destination:
    name: ryzen
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
