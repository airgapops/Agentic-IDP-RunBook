# =============================================================================
# OpenChoreo Environment — Development
# =============================================================================
# Note: OpenChoreo uses annotations for display metadata and
# spec.dataPlaneRef instead of spec.dataPlane.
# This environment already exists in the cluster.
apiVersion: openchoreo.dev/v1alpha1
kind: Environment
metadata:
  name: development
  annotations:
    openchoreo.dev/display-name: "Development"
    openchoreo.dev/description: "Development environment for testing and iteration"
  labels:
    openchoreo.dev/name: development
spec:
  dataPlaneRef:
    kind: ClusterDataPlane
    name: default
  isProduction: false
