---
# Namespace para vcluster-mock en Ryzen
apiVersion: kubernetes.crossplane.io/v1alpha1
kind: Object
metadata:
  name: ns-vcluster-mock
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  providerConfigRef:
    name: ryzen-compute-cluster
  forProvider:
    manifest:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: vcluster-mock
        labels:
          zerops.io/vcluster: "mock"
          zerops.io/workload: "mock-api"
---
# vcluster-mock: Cluster virtual para el servicio Mock JSON API
# Expuesto en: https://api.zerops.internal
# API vcluster accesible en: https://192.168.0.13:32101
apiVersion: helm.crossplane.io/v1beta1
kind: Release
metadata:
  name: vcluster-mock
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  providerConfigRef:
    name: ryzen-helm-cluster
  forProvider:
    chart:
      name: vcluster
      repository: https://charts.loft.sh
      version: "0.15.5"
    namespace: vcluster-mock
    values:
      serviceCIDR: "10.43.0.0/16"
      vcluster:
        extraArgs:
        - --tls-san=192.168.0.13
      syncer:
        extraArgs:
        - --tls-san=192.168.0.13
      # Exponer API del vcluster como NodePort fijo en 32101
      service:
        type: NodePort
        httpsNodePort: 32101
