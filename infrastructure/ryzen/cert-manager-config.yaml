apiVersion: v1
kind: Secret
metadata:
  name: step-ca-root
  namespace: cert-manager
type: Opaque
data:
  ca.crt: 
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: step-ca
spec:
  acme:
    server: https://192.168.0.9:9000/acme/acme/directory
    email: admin@zerops.internal
    caBundle: 
    privateKeySecretRef:
      name: step-ca-acme-account-key
    solvers:
    - http01:
        ingress:
          ingressClassName: traefik
