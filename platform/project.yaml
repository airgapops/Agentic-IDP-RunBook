# Note: OpenChoreo uses annotations for display metadata, not spec fields.
# A project named "default" already exists — this file is for reference.
# To create a new project, change metadata.name.
apiVersion: openchoreo.dev/v1alpha1
kind: Project
metadata:
  name: default
  annotations:
    openchoreo.dev/display-name: "Zerops Sovereign IDP"
    openchoreo.dev/description: >-
      Internal Developer Platform air-gapped multi-cluster.
      Manages isolated development environments, databases,
      message brokers, and LLM workloads on bare-metal K3s.
spec: {}
