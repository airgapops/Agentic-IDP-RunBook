apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: compositellmkubes.zerops.internal
  labels:
    provider: kubernetes
spec:
  compositeTypeRef:
    apiVersion: zerops.internal/v1alpha1
    kind: CompositeLlmKube
  compositeDeletePolicy: Background
  writeConnectionSecretsToNamespace: crossplane-system
  resources:
  - name: ollama-deployment
    base:
      apiVersion: kubernetes.crossplane.io/v1alpha1
      kind: Object
      spec:
        providerConfigRef:
          name: ryzen-compute-cluster
        forProvider:
          manifest:
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: ollama-gpu
              namespace: default-ns
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: ollama
              template:
                metadata:
                  labels:
                    app: ollama
                spec:
                  containers:
                  - name: ollama
                    image: ollama/ollama:0.1.48
                    ports:
                    - containerPort: 11434
                      name: http
                    resources:
                      limits:
                        nvidia.com/gpu: "1"
                    volumeMounts:
                    - name: ollama-storage
                      mountPath: /root/.ollama
                  - name: model-puller
                    image: curlimages/curl:latest
                    command:
                    - /bin/sh
                    - -c
                    - |
                      echo "Waiting for Ollama to start..."
                      until curl -s http://127.0.0.1:11434/api/tags > /dev/null; do
                        sleep 2
                      done
                      echo "Ollama is ready. Pulling model..."
                      curl -X POST http://127.0.0.1:11434/api/pull -d '{"name": "llama3"}'
                      echo "Model pulled successfully!"
                      while true; do sleep 3600; done
                  volumes:
                  - name: ollama-storage
                    emptyDir: {}
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.vclusterNamespace
      toFieldPath: spec.forProvider.manifest.metadata.namespace
    - type: FromCompositeFieldPath
      fromFieldPath: spec.model
      toFieldPath: spec.forProvider.manifest.spec.template.spec.containers[1].command[2]
      transforms:
      - type: string
        string:
          fmt: |
            echo "Waiting for Ollama to start..."
            until curl -s http://127.0.0.1:11434/api/tags > /dev/null; do
              sleep 2
            done
            echo "Ollama is ready. Pulling model %s..."
            curl -X POST http://127.0.0.1:11434/api/pull -d '{"name": "%s"}'
            echo "Model pulled successfully!"
            while true; do sleep 3600; done
    - type: FromCompositeFieldPath
      fromFieldPath: spec.gpuCount
      toFieldPath: spec.forProvider.manifest.spec.template.spec.containers[0].resources.limits["nvidia.com/gpu"]
      transforms:
      - type: string
        string:
          fmt: "%d"
    - type: FromCompositeFieldPath
      fromFieldPath: metadata.name
      toFieldPath: metadata.name
      transforms:
      - type: string
        string:
          fmt: "%s-ollama-dep"
  - name: ollama-service
    base:
      apiVersion: kubernetes.crossplane.io/v1alpha1
      kind: Object
      spec:
        providerConfigRef:
          name: ryzen-compute-cluster
        forProvider:
          manifest:
            apiVersion: v1
            kind: Service
            metadata:
              name: llmkube-service
              namespace: default-ns
            spec:
              selector:
                app: ollama
              ports:
              - protocol: TCP
                port: 80
                targetPort: 11434
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.vclusterNamespace
      toFieldPath: spec.forProvider.manifest.metadata.namespace
    - type: FromCompositeFieldPath
      fromFieldPath: metadata.name
      toFieldPath: metadata.name
      transforms:
      - type: string
        string:
          fmt: "%s-ollama-svc"
