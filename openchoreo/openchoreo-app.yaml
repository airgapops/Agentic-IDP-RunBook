apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: choreo-cert
  namespace: default
spec:
  commonName: choreo.zerops.internal
  dnsNames:
    - choreo.zerops.internal
  issuerRef:
    kind: ClusterIssuer
    name: zerops-ca-issuer
  secretName: choreo-tls-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openchoreo-app
  namespace: openchoreo-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openchoreo-app
  template:
    metadata:
      labels:
        app: openchoreo-app
    spec:
      containers:
      - name: backstage
        image: roadiehq/community-backstage-image:latest
        env:
        - name: POSTGRES_HOST
          value: openchoreo-db-service.openchoreo-system.svc.cluster.local
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: backstagepass
        - name: POSTGRES_DB
          value: backstage_plugin_auth
        - name: APP_CONFIG_app_baseUrl
          value: https://choreo.zerops.internal
        - name: APP_CONFIG_backend_baseUrl
          value: https://choreo.zerops.internal
        - name: APP_CONFIG_backend_cors_origin
          value: https://choreo.zerops.internal
        # TLS: skip verification for internal Step-CA signed Gitea
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
        args:
        - node
        - packages/backend
        - --config
        - /usr/src/app/app-config.yaml
        - --config
        - /usr/src/app/app-config.catalog.yaml
        ports:
        - containerPort: 7000
          name: http
        volumeMounts:
        - name: catalog-config
          mountPath: /usr/src/app/app-config.catalog.yaml
          subPath: app-config.catalog.yaml
      volumes:
      - name: catalog-config
        configMap:
          name: backstage-catalog-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-catalog-config
  namespace: openchoreo-system
data:
  app-config.catalog.yaml: |
    backend:
      reading:
        allow:
          - host: gitea.zerops.internal
    integrations:
      gitea:
        - host: gitea.zerops.internal
          baseUrl: https://gitea.zerops.internal
          username: jadamson
          password: Panama2028#...
    catalog:
      locations:
        - type: url
          target: https://gitea.zerops.internal/jadamson/airgap-ops/raw/branch/main/backstage-catalog/infrastructure-catalog.yaml
          rules:
            - allow: [Component, System, Resource, API, Location]

apiVersion: v1
kind: Service
metadata:
  name: openchoreo-service
  namespace: openchoreo-system
spec:
  selector:
    app: openchoreo-app
  ports:
  - port: 80
    targetPort: 7000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openchoreo-route
  namespace: openchoreo-system
spec:
  parentRefs:
    - name: zerops-gateway
      namespace: default
  hostnames:
    - "choreo.zerops.internal"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: openchoreo-service
          port: 80
