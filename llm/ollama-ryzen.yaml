---
# =============================================================================
# Ollama en Ryzen K3s — Accesible desde ThinkPad en :11434
# Aplicar desde ThinkPad: kubectl --kubeconfig=ryzen-kubeconfig.yaml apply -f ollama-ryzen.yaml
# =============================================================================

# --- Namespace ---
apiVersion: v1
kind: Namespace
metadata:
  name: ollama-system
  labels:
    app.kubernetes.io/part-of: zerops-idp
---
# --- PVC para modelos (los modelos son grandes: Llama 3.1 8B ≈ 5GB) ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: ollama-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi    # suficiente para 3-4 modelos
---
# =============================================================================
# OPCIÓN A: NVIDIA GPU (descomenta resources.limits si tienes NVIDIA)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama-system
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
          name: api
        env:
        # Para NVIDIA: descomentar la siguiente línea
        # - name: NVIDIA_VISIBLE_DEVICES
        #   value: "all"
        # Para AMD ROCm: descomentar las siguientes
        # - name: HSA_OVERRIDE_GFX_VERSION
        #   value: "11.0.0"   # Ajustar según tu GPU AMD
        - name: OLLAMA_HOST
          value: "0.0.0.0:11434"
        - name: OLLAMA_ORIGINS
          value: "*"
        volumeMounts:
        - name: models
          mountPath: /root/.ollama
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "16Gi"
            cpu: "8000m"
          # NVIDIA GPU — descomentar si tienes NVIDIA:
          # limits:
          #   nvidia.com/gpu: "1"
          #   memory: "16Gi"
          # AMD GPU — descomentar si tienes AMD:
          # limits:
          #   amd.com/gpu: "1"
          #   memory: "16Gi"
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: ollama-models
      # Para GPU AMD (ROCm), se necesita acceso al device:
      # runtimeClassName: gpu  # Solo si está configurado el runtime
---
# --- Service: ClusterIP (visible desde ThinkPad via kubeconfig) ---
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: ollama-system
spec:
  type: NodePort
  selector:
    app: ollama
  ports:
  - port: 11434
    targetPort: 11434
    nodePort: 31434      # Accesible en 192.168.0.13:31434 desde cualquier nodo
    name: api
