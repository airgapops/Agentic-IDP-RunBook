---
# Traefik — IngressController para el host K3s del Ryzen
# NOTA: Sin redirect global HTTP→HTTPS para que ACME HTTP-01 challenge funcione.
# Los Ingresses de produccion hacen redirect via anotacion individual.
apiVersion: helm.crossplane.io/v1beta1
kind: Release
metadata:
  name: traefik
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  providerConfigRef:
    name: ryzen-helm-cluster
  forProvider:
    chart:
      name: traefik
      repository: https://helm.traefik.io/traefik
      version: "26.1.0"
    namespace: traefik-system
    values:
      service:
        type: LoadBalancer

      ports:
        web:
          port: 8000
          expose: true
          exposedPort: 80
          # Sin redirectTo: cert-manager HTTP-01 ACME challenge necesita HTTP puro
        websecure:
          port: 8443
          expose: true
          exposedPort: 443
          tls:
            enabled: true

      ingressClass:
        enabled: true
        isDefaultClass: true

      providers:
        kubernetesIngress:
          enabled: true
          publishedService:
            enabled: true

      rbac:
        enabled: true

      ingressRoute:
        dashboard:
          enabled: false
