# =============================================================================
# OpenChoreo Component — PostgreSQL Database
# =============================================================================
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: postgres
  namespace: default
  annotations:
    openchoreo.dev/display-name: "PostgreSQL Database"
    openchoreo.dev/description: >-
      PostgreSQL 16 database. Provides persistent relational
      data storage for platform services.
  labels:
    openchoreo.dev/name: postgres
spec:
  owner:
    projectName: default
---
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: postgres
  namespace: default
spec:
  owner:
    componentName: postgres
  container:
    image: postgres:16-alpine
    ports:
      - name: postgres
        port: 5432
