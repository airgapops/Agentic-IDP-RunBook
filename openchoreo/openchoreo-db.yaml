apiVersion: v1
kind: Namespace
metadata:
  name: openchoreo-system
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openchoreo-db-pvc
  namespace: openchoreo-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openchoreo-db
  namespace: openchoreo-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openchoreo-db
  template:
    metadata:
      labels:
        app: openchoreo-db
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: backstage_plugin_auth
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: backstagepass
        ports:
        - containerPort: 5432
          name: postgres
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: pgdata
        persistentVolumeClaim:
          claimName: openchoreo-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: openchoreo-db-service
  namespace: openchoreo-system
spec:
  selector:
    app: openchoreo-db
  ports:
  - port: 5432
    targetPort: 5432
