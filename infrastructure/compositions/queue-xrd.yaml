apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: compositequeues.zerops.internal
spec:
  group: zerops.internal
  names:
    kind: CompositeQueue
    plural: compositequeues
  claimNames:
    kind: Queue
    plural: queues
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              provider:
                type: string
                description: Message queue provider (rabbitmq, kafka)
                default: rabbitmq
              vclusterNamespace:
                type: string
                description: Namespace within the vcluster/host where the queue should be deployed
            required:
            - provider
            - vclusterNamespace
