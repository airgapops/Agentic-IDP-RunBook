---
# =============================================================================
# ZEROPS SOVEREIGN IDP — Backstage Catalog Entities
# Sistema de Infraestructura como Producto (InfraAsProduct)
# Descubierto automáticamente desde Gitea por OpenChoreo/Backstage
# =============================================================================

# --------------------------------------------------------------------------
# SYSTEM: El IDP completo como sistema de negocio
# --------------------------------------------------------------------------
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: zerops-sovereign-idp
  title: Zerops Sovereign IDP
  description: >
    Internal Developer Platform air-gapped multi-cluster.
    Aprovisiona entornos de desarrollo aislados (vcluster) con bases de datos,
    colas de mensajes y modelos LLM. Todo gestionado vía ArgoCD GitOps puro
    con App-of-Apps pattern sobre clusters K3s bare-metal.
  tags:
    - infrastructure
    - platform-engineering
    - air-gapped
    - argocd
    - gitops
    - vcluster
  annotations:
    backstage.io/techdocs-ref: dir:.
    github.com/project-slug: jadamson/airgap-ops
spec:
  owner: platform-team
  domain: infrastructure
---
# --------------------------------------------------------------------------
# RESOURCE: Management Cluster (ThinkPad)
# El cerebro del IDP — corre ArgoCD, cert-manager, Gateway API, OpenChoreo
# --------------------------------------------------------------------------
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: thinkpad-management-cluster
  title: ThinkPad — Management Cluster
  description: >
    Clúster K3s principal que actúa como Control Plane del IDP.
    Ejecuta: ArgoCD (GitOps), cert-manager (TLS vía Step-CA),
    Envoy Gateway (ingress Gateway API), OpenChoreo (developer portal),
    ThunderID (OIDC identity provider).
  tags:
    - kubernetes
    - k3s
    - management-cluster
    - argocd
    - openchoreo
  annotations:
    backstage.io/managed-by-location: url:https://gitea.zerops.internal/jadamson/airgap-ops
    zerops.internal/node-ip: "192.168.0.10"
    zerops.internal/k3s-version: "1.35"
    zerops.internal/role: management
  links:
    - url: https://argocd.zerops.internal
      title: ArgoCD UI
      icon: dashboard
    - url: https://choreo.zerops.internal
      title: OpenChoreo (Developer Portal)
      icon: dashboard
spec:
  type: kubernetes-cluster
  owner: platform-team
  system: zerops-sovereign-idp
  lifecycle: production
  dependsOn:
    - resource:raspberry-pi-dns-pki
---
# --------------------------------------------------------------------------
# RESOURCE: Compute Node (Ryzen)
# El músculo — donde viven los vclusters y las cargas de trabajo
# --------------------------------------------------------------------------
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: ryzen-compute-cluster
  title: Ryzen — Compute Cluster
  description: >
    Nodo de cómputo K3s donde ArgoCD despliega vclusters nativos como
    ArgoCD Applications apuntando al Helm chart de Loft vcluster.
    Cada vcluster corre en su propio namespace aislado.
    Incluye MetalLB, Traefik y cert-manager para networking de workloads.
  tags:
    - kubernetes
    - k3s
    - compute-node
    - vcluster
    - gpu
  annotations:
    zerops.internal/node-ip: "192.168.0.13"
    zerops.internal/k3s-version: "1.35"
    zerops.internal/role: compute
    zerops.internal/current-vclusters: "3"
  links:
    - url: https://argocd.zerops.internal/applications
      title: ArgoCD Apps
      icon: code
spec:
  type: kubernetes-cluster
  owner: platform-team
  system: zerops-sovereign-idp
  lifecycle: production
  dependsOn:
    - resource:thinkpad-management-cluster
---
# --------------------------------------------------------------------------
# RESOURCE: Raspberry Pi — DNS + PKI
# La fundación — resuelve dominios internos y firma certificados TLS
# --------------------------------------------------------------------------
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: raspberry-pi-dns-pki
  title: Raspberry Pi — DNS & PKI (Tier-0)
  description: >
    Infraestructura de Día Cero. Corre PowerDNS (Split-Horizon DNS para
    zerops.internal) y Step-CA (servidor ACME privado para TLS interno).
    Todo el tráfico mTLS del IDP depende de este nodo.
  tags:
    - dns
    - pki
    - step-ca
    - powerdns
    - tier-0
  annotations:
    zerops.internal/node-ip: "192.168.0.9"
    zerops.internal/role: network-identity
    zerops.internal/dns-zone: zerops.internal
    zerops.internal/ca-url: https://step-ca.zerops.internal:9000
    backstage.io/techdocs-ref: dir:docs/playbooks/PB-00-corporate-network-identity.md
  links:
    - url: http://192.168.0.9:8081
      title: PowerDNS API
      icon: api
spec:
  type: network-infrastructure
  owner: platform-team
  system: zerops-sovereign-idp
  lifecycle: production
---
# --------------------------------------------------------------------------
# RESOURCE: vcluster-mock — Entorno de API mock
# --------------------------------------------------------------------------
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: vcluster-mock
  title: vcluster-mock (Dev Environment)
  description: >
    Entorno de desarrollo aislado para mock API. Desplegado como ArgoCD
    Application usando el Helm chart oficial de Loft vcluster v0.15.5.
    Corre en el namespace vcluster-mock del Ryzen compute cluster.
  tags:
    - vcluster
    - dev-environment
    - argocd-managed
  annotations:
    zerops.internal/namespace: vcluster-mock
    zerops.internal/vcluster-version: "0.15.5"
    zerops.internal/status: Running
  links:
    - url: https://argocd.zerops.internal/applications/vcluster-mock
      title: ArgoCD — vcluster-mock
      icon: dashboard
spec:
  type: platform-environment
  owner: platform-team
  system: zerops-sovereign-idp
  lifecycle: development
  dependsOn:
    - resource:ryzen-compute-cluster
---
# --------------------------------------------------------------------------
# COMPONENT: ArgoCD — GitOps Engine
# --------------------------------------------------------------------------
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: argocd-gitops-engine
  title: ArgoCD — GitOps Engine
  description: >
    Motor de GitOps con patrón App-of-Apps. Sincroniza el estado deseado
    del repositorio Gitea con el estado real de ambos clusters (ThinkPad
    y Ryzen). Gestiona infrastructure, gateway, vclusters y tenant apps.
  tags:
    - argocd
    - gitops
    - continuous-delivery
    - app-of-apps
  annotations:
    zerops.internal/installed-on: thinkpad-management-cluster
    zerops.internal/namespace: argocd
    zerops.internal/git-repo: https://gitea.zerops.internal/jadamson/airgap-ops.git
  links:
    - url: https://argocd.zerops.internal
      title: ArgoCD UI
      icon: dashboard
spec:
  type: platform-tool
  owner: platform-team
  system: zerops-sovereign-idp
  lifecycle: production
---
# --------------------------------------------------------------------------
# LOCATION: Registra el Golden Path Software Template en Backstage
# --------------------------------------------------------------------------
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: vcluster-platform-template-location
  title: Golden Path Templates
spec:
  type: url
  target: https://gitea.zerops.internal/jadamson/airgap-ops/raw/branch/main/backstage-catalog/templates/vcluster-template/template.yaml
