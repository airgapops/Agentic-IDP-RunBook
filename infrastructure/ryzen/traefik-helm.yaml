---
# Traefik — IngressController para el host K3s del Ryzen
# NOTAS IMPORTANTES:
# 1. Sin redirect global HTTP→HTTPS (rompe ACME HTTP-01 challenge de cert-manager)
# 2. nativeLBByDefault=true: Traefik usa ClusterIP en lugar de pod IPs directos
#    (necesario porque Flannel VXLAN tiene rutas stale post-reboot en algunos pods)
apiVersion: helm.crossplane.io/v1beta1
kind: Release
metadata:
  name: traefik
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  providerConfigRef:
    name: ryzen-helm-cluster
  forProvider:
    chart:
      name: traefik
      repository: https://helm.traefik.io/traefik
      version: "26.1.0"
    namespace: traefik-system
    values:
      service:
        type: LoadBalancer

      ports:
        web:
          port: 8000
          expose: true
          exposedPort: 80
          # Sin redirectTo: cert-manager ACME HTTP-01 necesita HTTP puro
        websecure:
          port: 8443
          expose: true
          exposedPort: 443
          tls:
            enabled: true

      ingressClass:
        enabled: true
        isDefaultClass: true

      providers:
        kubernetesIngress:
          enabled: true
          publishedService:
            enabled: true
          # Usar ClusterIP en lugar de pod IPs (fix para Flannel VXLAN post-reboot)
          nativeLBByDefault: true

      rbac:
        enabled: true

      ingressRoute:
        dashboard:
          enabled: false

      # Argumento adicional via CLI (doble cobertura del nativeLB fix)
      additionalArguments:
        - "--providers.kubernetesingress.nativeLBByDefault=true"
