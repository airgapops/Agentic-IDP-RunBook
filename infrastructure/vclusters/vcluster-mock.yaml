---
# Namespace para vcluster-mock en Ryzen
apiVersion: kubernetes.crossplane.io/v1alpha1
kind: Object
metadata:
  name: ns-vcluster-mock
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  providerConfigRef:
    name: ryzen-compute-cluster
  forProvider:
    manifest:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: vcluster-mock
        labels:
          zerops.io/vcluster: "mock"
          zerops.io/workload: "mock-api"
---
# vcluster-mock: mock-api
# Ingress sync habilitado para que los Ingress del vcluster
# se sincronicen al host K3s donde Traefik los procesa.
apiVersion: helm.crossplane.io/v1beta1
kind: Release
metadata:
  name: vcluster-mock
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  providerConfigRef:
    name: ryzen-helm-cluster
  forProvider:
    chart:
      name: vcluster
      repository: https://charts.loft.sh
      version: "0.15.5"
    namespace: vcluster-mock
    values:
      serviceCIDR: "10.43.0.0/16"
      vcluster:
        extraArgs:
        - --tls-san=192.168.0.13
      syncer:
        extraArgs:
        - --tls-san=192.168.0.13
        # Habilitar sync de Ingress al host (REQUERIDO en 0.15.5)
        - --enable-ingress-classes=true
      service:
        type: NodePort
      # Sync de recursos al host K3s
      sync:
        ingresses:
          enabled: true
