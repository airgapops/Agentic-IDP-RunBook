apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openchoreo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitea.zerops.internal/jadamson/airgap-ops.git
    targetRevision: HEAD
    path: openchoreo
  destination:
    server: https://kubernetes.default.svc
    namespace: openchoreo-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
