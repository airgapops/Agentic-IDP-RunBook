apiVersion: scaffold.backstage.io/v1beta3
kind: Template
metadata:
  name: request-vcluster-environment
  title: Solicitar Entorno de Desarrollo (vcluster)
  description: >
    Crea de forma automatizada un nuevo clúster virtual (vcluster) aislado
    sobre el clúster de cómputo físico (Ryzen) utilizando Crossplane y GitOps.
  tags:
    - self-service
    - vcluster
    - kubernetes
    - ryzen
spec:
  owner: platform-team
  type: service

  parameters:
    - title: Configuración Básica
      required:
        - environmentName
        - size
      properties:
        environmentName:
          type: string
          title: Nombre del Entorno
          description: Nombre único para el namespace y el vcluster (minúsculas y guiones).
          ui:autofocus: true
          pattern: '^[a-z0-9-]+$'
        size:
          type: string
          title: Tamaño de Recursos
          description: Capacidad asignada de CPU y Memoria RAM.
          enum:
            - small
            - medium
            - large
          default: small

  steps:
    - id: fetch-template
      name: Recuperar Golden Path Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          environmentName: ${{ parameters.environmentName }}
          size: ${{ parameters.size }}

    - id: publish-git
      name: Publicar en Gitea (GitOps Push)
      action: publish:gitea
      input:
        allowedHosts:
          - gitea.zerops.internal
        repoUrl: gitea.zerops.internal/jadamson/airgap-ops
        branchName: main
        title: "feat(vcluster): aprovisionar entorno ${{ parameters.environmentName }}"
        description: Aprovisionamiento de vcluster solicitado automáticamente vía Developer Portal (OpenChoreo).

  output:
    links:
      - title: Ver en Gitea
        url: https://gitea.zerops.internal/jadamson/airgap-ops/src/branch/main/infrastructure/vclusters/vcluster-${{ parameters.environmentName }}.yaml
