apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: compositequeues.zerops.internal
  labels:
    provider: helm
spec:
  compositeTypeRef:
    apiVersion: zerops.internal/v1alpha1
    kind: CompositeQueue
  compositeDeletePolicy: Background
  writeConnectionSecretsToNamespace: crossplane-system
  resources:
  - name: queue-helm
    base:
      apiVersion: helm.crossplane.io/v1beta1
      kind: Release
      spec:
        providerConfigRef:
          name: ryzen-helm-cluster
        forProvider:
          chart:
            name: rabbitmq
            repository: https://charts.bitnami.com/bitnami
            version: 12.0.0
          namespace: default-ns
          values:
            auth:
              username: guest
              password: guest
            replicaCount: 1
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.vclusterNamespace
      toFieldPath: spec.forProvider.namespace
    - type: FromCompositeFieldPath
      fromFieldPath: spec.provider
      toFieldPath: spec.forProvider.chart.name
      transforms:
      - type: map
        map:
          rabbitmq: rabbitmq
          kafka: kafka
    - type: FromCompositeFieldPath
      fromFieldPath: metadata.name
      toFieldPath: metadata.name
      transforms:
      - type: string
        string:
          fmt: "%s-queue"
  - name: dapr-pubsub
    base:
      apiVersion: kubernetes.crossplane.io/v1alpha1
      kind: Object
      spec:
        providerConfigRef:
          name: ryzen-compute-cluster
        forProvider:
          manifest:
            apiVersion: dapr.io/v1alpha1
            kind: Component
            metadata:
              name: pubsub
              namespace: default-ns
            spec:
              type: pubsub.rabbitmq
              version: v1
              metadata:
              - name: connectionString
                value: amqp://guest:guest@default-queue-rabbitmq:5672
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.vclusterNamespace
      toFieldPath: spec.forProvider.manifest.metadata.namespace
    - type: FromCompositeFieldPath
      fromFieldPath: metadata.name
      toFieldPath: spec.forProvider.manifest.spec.metadata[0].value
      transforms:
      - type: string
        string:
          fmt: "amqp://guest:guest@%s-queue-rabbitmq:5672"
