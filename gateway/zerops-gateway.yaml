apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: zerops-gateway
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: zerops-ca-issuer
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https-gitea
      protocol: HTTPS
      port: 443
      hostname: gitea.zerops.internal
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: gitea-tls-secret
      allowedRoutes:
        namespaces:
          from: All
    - name: https-argocd
      protocol: HTTPS
      port: 443
      hostname: argocd.zerops.internal
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: argocd-tls-secret
      allowedRoutes:
        namespaces:
          from: All
    - name: https-choreo
      protocol: HTTPS
      port: 443
      hostname: choreo.zerops.internal
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: choreo-tls-secret
      allowedRoutes:
        namespaces:
          from: All

