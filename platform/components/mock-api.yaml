# =============================================================================
# OpenChoreo Component — Mock API
# HTTP echo service for testing platform connectivity
# =============================================================================
# Available ClusterComponentTypes:
#   service (deployment), web-application (deployment),
#   worker (deployment), scheduled-task (cronjob)
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: mock-api
  namespace: default
  annotations:
    openchoreo.dev/display-name: "Mock API"
    openchoreo.dev/description: >-
      Lightweight HTTP echo service that returns request metadata as JSON.
      Used for testing platform connectivity and routing.
  labels:
    openchoreo.dev/name: mock-api
spec:
  owner:
    projectName: default
  componentType:
    kind: ClusterComponentType
    name: deployment/service
---
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: mock-api
  namespace: default
spec:
  owner:
    componentName: mock-api
  container:
    image: mendhak/http-https-echo:33
